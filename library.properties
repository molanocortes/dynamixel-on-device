name=dynamixel-on-device
version=1.0.0
author=Juan Sebastian Molano
maintainer=Juan Sebastian Molano
sentence=Zero-heap Dynamixel Protocol 2.0 master with Fast Sync Read, for closing a servo control loop on the microcontroller instead of a host PC.
paragraph=A minimal, reentrant Protocol 2.0 master (PING/READ/WRITE, Sync Read/Write, and Fast Sync Read 0x8A) for ROBOTIS Dynamixel X-series servos over a half-duplex bus, plus a 2 kHz current-control transparency example. Full byte-stuffing, table-driven CRC-16, every wait bounded, no dynamic allocation. Half-duplex direction control is selectable (UART-timed on Teensy, portable GPIO toggle elsewhere, or your own handler), so it builds on any Arduino core. Host-testable with no hardware.
category=Device Control
url=https://github.com/molanocortes/dynamixel-on-device
architectures=*
includes=tiny_dxl.h
