sentence=Tiny, zero-heap Dynamixel Protocol 2.0 master for Teensy with Fast Sync Read and a 2 kHz current-control loop.
paragraph=A minimal, reentrant Protocol 2.0 master (PING/READ/WRITE, Sync Read/Write, and Fast Sync Read 0x8A) for ROBOTIS Dynamixel X-series servos over a 74HC241 half-duplex bus, plus a 2 kHz current-control transparency example. Full byte-stuffing, table-driven CRC-16, every wait bounded, and host-testable with no hardware.
